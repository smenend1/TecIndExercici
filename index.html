<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f5b">
  <title>Tecnologia Industrial Exercicis Plus</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./assets/icon-192.png">
  <style>
    :root{--bg:#f4f7f5;--card:#fff;--ink:#1b2521;--muted:#5a6a62;--brand:#1f6f5b;--brand2:#2563eb;--soft:#e6f1ec;--line:#d7e0db;--warn:#fff4d6;--bad:#fde2e2;--good:#e2f6ea;--shadow:0 10px 26px rgba(20,45,35,.08);--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}header{background:linear-gradient(135deg,#eaf5ef,#f8fbfa);border-bottom:1px solid var(--line);padding:18px 14px 12px;position:sticky;top:0;z-index:3}.wrap{max-width:1180px;margin:0 auto}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#1f6f5b;color:white;display:grid;place-items:center;font-weight:800}.brand h1{font-size:clamp(1.45rem,5vw,2.5rem);line-height:1.05;margin:.1rem 0}.tag{margin:.35rem 0 0;color:var(--muted);font-weight:600}.tabs{display:flex;gap:8px;overflow:auto;padding-top:14px}.tab{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:999px;font-weight:700;white-space:nowrap;color:var(--ink)}.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}main{max-width:1180px;margin:0 auto;padding:18px 14px 90px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.card h2,.card h3{margin-top:0}.btn,.primary,.secondary{border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:800;background:#fff;color:var(--ink);cursor:pointer}.primary{background:var(--brand);color:white;border-color:var(--brand)}.secondary{background:var(--soft);color:#163e34;border-color:#cde3d9}.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}label{font-weight:800}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:white}textarea{min-height:110px}.result{border-left:5px solid var(--brand);background:#f8fcfa;border-radius:14px;padding:14px;margin-top:14px;white-space:normal}.steps{background:#f7f9fb;border:1px solid var(--line);border-radius:14px;padding:14px}.pill{display:inline-block;background:var(--soft);padding:5px 10px;border-radius:999px;font-weight:800;margin:3px}.notice{background:var(--warn);border:1px solid #efd27a;border-radius:14px;padding:12px}.ok{background:var(--good);border:1px solid #b7e6c7;border-radius:14px;padding:12px}.bad{background:var(--bad);border:1px solid #efb5b5;border-radius:14px;padding:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;background:#fff;border-radius:12px;overflow:hidden}th,td{border:1px solid var(--line);padding:9px;text-align:left}th{background:#eaf5ef}.hidden{display:none!important}.formula{font-family:Georgia,'Times New Roman',serif;font-size:1.08rem;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.gate-svg{width:100%;max-width:720px;border:1px solid var(--line);border-radius:14px;background:#fff}.small{font-size:.92rem;color:var(--muted)}@media(max-width:720px){header{padding:14px 10px 10px}main{padding:14px 10px 80px}.card{padding:14px}.tab{padding:9px 11px}.grid{grid-template-columns:1fr}.brand h1{font-size:1.6rem}.btnrow .primary,.btnrow .secondary,.btnrow .btn{flex:1 1 auto}}@media print{header,.tabs,.no-print,.btnrow,button{display:none!important}body{background:#fff;color:#000;font-family:'Times New Roman',Times,serif;font-size:12pt}main{padding:0}.card,.result,.steps{box-shadow:none;border:1px solid #999;border-radius:0;break-inside:avoid}a{color:#000;text-decoration:none}}
  .explain{border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:12px 0;background:#fff}.explain summary{cursor:pointer;font-weight:800;color:#143d34}.checklist li{margin:6px 0}.similar{background:#eef7f3;border:1px dashed #7eb5a3;border-radius:18px;padding:14px;margin-top:14px}</style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand"><div class="logo">PAU</div><div><h1>Tecnologia Industrial Exercicis Plus</h1><p class="tag">PWA educativa · Exercicis guiats · PAU · Batxillerat</p></div></div>
      <nav class="tabs" aria-label="Navegació principal">
        <button class="tab active" data-view="inici">Inici</button>
        <button class="tab" data-view="pau">PAU</button>
        <button class="tab" data-view="exercicis">Exercicis</button>
        <button class="tab" data-view="calculadores">Calculadores</button>
        <button class="tab" data-view="practica">Pràctica</button>
        <button class="tab" data-view="formulari">Formulari</button>
        <button class="tab" data-view="historial">Historial</button>
      </nav>
    </div>
  </header>
  <main id="app"></main>
  <script src="./app.js"></script>
</body>
</html>
