<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f5b">
  <title>Tecnologia Industrial Exercicis Plus v16</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./assets/icon-192.png">
  <style>
    :root{--bg:#f4f7f5;--card:#fff;--ink:#1b2521;--muted:#5a6a62;--brand:#1f6f5b;--brand2:#2563eb;--soft:#e6f1ec;--line:#d7e0db;--warn:#fff4d6;--bad:#fde2e2;--good:#e2f6ea;--shadow:0 10px 26px rgba(20,45,35,.08);--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}header{background:linear-gradient(135deg,#eaf5ef,#f8fbfa);border-bottom:1px solid var(--line);padding:18px 14px 12px;position:sticky;top:0;z-index:3}.wrap{max-width:1180px;margin:0 auto}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#1f6f5b;color:white;display:grid;place-items:center;font-weight:800}.brand h1{font-size:clamp(1.45rem,5vw,2.5rem);line-height:1.05;margin:.1rem 0}.tag{margin:.35rem 0 0;color:var(--muted);font-weight:600}.tabs{display:flex;gap:8px;overflow:auto;padding-top:14px}.tab{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:999px;font-weight:700;white-space:nowrap;color:var(--ink)}.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}main{max-width:1180px;margin:0 auto;padding:18px 14px 90px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.card h2,.card h3{margin-top:0}.btn,.primary,.secondary{border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:800;background:#fff;color:var(--ink);cursor:pointer}.primary{background:var(--brand);color:white;border-color:var(--brand)}.secondary{background:var(--soft);color:#163e34;border-color:#cde3d9}.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}label{font-weight:800}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:white}textarea{min-height:110px}.result{border-left:5px solid var(--brand);background:#f8fcfa;border-radius:14px;padding:14px;margin-top:14px;white-space:normal}.steps{background:#f7f9fb;border:1px solid var(--line);border-radius:14px;padding:14px}.pill{display:inline-block;background:var(--soft);padding:5px 10px;border-radius:999px;font-weight:800;margin:3px}.notice{background:var(--warn);border:1px solid #efd27a;border-radius:14px;padding:12px}.ok{background:var(--good);border:1px solid #b7e6c7;border-radius:14px;padding:12px}.bad{background:var(--bad);border:1px solid #efb5b5;border-radius:14px;padding:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;background:#fff;border-radius:12px;overflow:hidden}th,td{border:1px solid var(--line);padding:9px;text-align:left}th{background:#eaf5ef}.hidden{display:none!important}.formula{font-family:Georgia,'Times New Roman',serif;font-size:1.08rem;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.gate-svg{width:100%;max-width:720px;border:1px solid var(--line);border-radius:14px;background:#fff}.small{font-size:.92rem;color:var(--muted)}@media(max-width:720px){header{padding:14px 10px 10px}main{padding:14px 10px 80px}.card{padding:14px}.tab{padding:9px 11px}.grid{grid-template-columns:1fr}.brand h1{font-size:1.6rem}.btnrow .primary,.btnrow .secondary,.btnrow .btn{flex:1 1 auto}}@media print{header,.tabs,.no-print,.btnrow,button{display:none!important}body{background:#fff;color:#000;font-family:'Times New Roman',Times,serif;font-size:12pt}main{padding:0}.card,.result,.steps{box-shadow:none;border:1px solid #999;border-radius:0;break-inside:avoid}a{color:#000;text-decoration:none}}
  .explain{border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:12px 0;background:#fff}.explain summary{cursor:pointer;font-weight:800;color:#143d34}.checklist li{margin:6px 0}.similar{background:#eef7f3;border:1px dashed #7eb5a3;border-radius:18px;padding:14px;margin-top:14px}
    .mode-banner{background:#e6f1ec;border:1px solid #cde3d9;border-radius:16px;padding:12px 14px;margin:10px 0 16px;color:#163e34}.mode-banner.teacher{background:#eef2ff;border-color:#c7d2fe;color:#1e3a8a}.progressbar{height:10px;background:#edf2ef;border-radius:999px;overflow:hidden;margin:12px 0 18px}.progressbar>div{height:100%;background:#1f6f5b;transition:width .25s ease}.step-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}.step-card textarea{min-height:96px}.step-feedback{margin-top:10px}.step-feedback pre,.ok pre{white-space:pre-wrap;font-family:inherit;margin:.5rem 0 0}.print-sheet .sheet-step{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fff}.blank-lines{min-height:110px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 28px,#d7e0db 29px);border:1px solid var(--line);border-radius:10px;margin-top:10px}@media print{.mode-banner,.progressbar,.step-feedback,.no-print{display:none!important}.print-sheet .sheet-step,.blank-lines{break-inside:avoid}.blank-lines{min-height:130px}}
.enunciat-box{border:1px solid var(--line);background:#f7fbf9;border-radius:18px;padding:14px 16px;margin:16px 0}.enunciat-box summary{font-weight:800;cursor:pointer;color:#12342d}.enunciat-box p{white-space:pre-wrap;line-height:1.55;margin:10px 0 0}
/* v15: correcció intel·ligent, progrés local i repàs personalitzat */
.exam-item{border:1px solid var(--line);border-radius:18px;padding:16px;margin:16px 0;background:#fff;break-inside:avoid}.exam-sheet h2{border-bottom:2px solid var(--brand);padding-bottom:8px}.exam-item h3{color:#143d34}.bad.pill{background:#fde2e2;color:#7f1d1d}.exam-item .blank-lines{min-height:150px}@media print{.exam-item{box-shadow:none;border:1px solid #777;page-break-inside:avoid}.exam-item .pdf-pages{grid-template-columns:1fr}.exam-sheet{border:0!important}}
/* v11: figures i pàgines originals del PDF */
.figures-box{background:#f8fbff;border-color:#c7d2fe}.pdf-pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:12px}.pdf-page-card{margin:0;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}.pdf-page-card img{display:block;width:100%;height:auto;background:white}.pdf-page-card figcaption{padding:8px 10px;font-size:.9rem;color:var(--muted)}@media print{.pdf-pages{grid-template-columns:1fr;gap:8px}.pdf-page-card{break-inside:avoid;box-shadow:none;border:1px solid #999}.pdf-page-card img{max-height:23cm;width:auto;max-width:100%;margin:0 auto}}

.solution-rich{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55;white-space:normal;overflow-wrap:anywhere}.solution-rich h4{margin:1rem 0 .45rem;padding:.45rem .65rem;border-left:5px solid #1f7a63;background:#eef7f3;border-radius:10px;color:#0f3f34}.solution-rich h5{margin:.75rem 0 .35rem;color:#164f43;font-weight:800}.formula-line{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f6f8fa;border:1px solid #d9e3df;border-radius:10px;padding:.45rem .6rem;margin:.35rem 0;display:block;overflow-x:auto;white-space:nowrap}@media print{.solution-rich{font-size:10.5pt;line-height:1.42}.solution-rich h4{background:#f2f2f2!important;border-left:4px solid #555;border-radius:0;padding:4pt 6pt}.formula-line{white-space:normal;border-radius:0}}

/* v16 · mirada docent */
.teacher-panel{border:1px solid var(--line);border-radius:20px;background:#fff;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.teacher-panel h3{margin-top:0;color:#123d34}
.teacher-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.teacher-kpi div{background:#eef7f3;border:1px solid #cfe7dc;border-radius:16px;padding:12px;text-align:center}
.teacher-kpi b{display:block;font-size:1.7rem;color:#1f6f5b}
.teacher-plan{border-left:6px solid #1f6f5b;background:#f8fcfa;border-radius:16px;padding:16px;margin:14px 0}
.teacher-plan h3,.teacher-plan h4{color:#123d34}
.teacher-timeline{counter-reset:step;list-style:none;padding:0;margin:0}
.teacher-timeline li{counter-increment:step;margin:10px 0;padding:12px 12px 12px 48px;border:1px solid var(--line);border-radius:14px;background:#fff;position:relative}
.teacher-timeline li:before{content:counter(step);position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#1f6f5b;color:#fff;font-weight:800}
.teacher-note{background:#eef2ff;border:1px solid #c7d2fe;color:#1e3a8a;border-radius:14px;padding:12px;margin:10px 0}
.teacher-danger{background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;border-radius:14px;padding:12px;margin:10px 0}
@media print{.teacher-panel,.teacher-plan{box-shadow:none;border:1px solid #888;break-inside:avoid}.teacher-timeline li{break-inside:avoid}.teacher-kpi{grid-template-columns:repeat(4,1fr)}.teacher-note,.teacher-danger{border:1px solid #999;background:#fff!important;color:#000}}
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand"><div class="logo">PAU</div><div><h1>Tecnologia Industrial Exercicis Plus</h1><p class="tag">PWA educativa · PAU resolt · Mode docent · Dossiers · Seguiment</p></div></div>
      <nav class="tabs" aria-label="Navegació principal">
        <button class="tab active" data-view="inici">Inici</button>
        <button class="tab" data-view="pau">PAU</button>
        <button class="tab" data-view="examen">Examen</button>
        <button class="tab" data-view="docent">Docent</button>
        <button class="tab" data-view="progres">Progrés</button>
        <button class="tab" data-view="exercicis">Exercicis</button>
        <button class="tab" data-view="calculadores">Calculadores</button>
        <button class="tab" data-view="practica">Pràctica</button>
        <button class="tab" data-view="formulari">Formulari</button>
        <button class="tab" data-view="historial">Historial</button>
      </nav>
    </div>
  </header>
  <main id="app"></main>
  <script src="./app.js"></script>
</body>
</html>
